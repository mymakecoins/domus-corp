packages:
  - "apps/*"
  - "packages/*"

storeDir: .pnpm-store
injectWorkspacePackages: true

overrides:
  pg-protocol: 1.15.0

allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: false
  # Transitive tooling dependency; Domus does not execute its install script.
  esbuild: false

minimumReleaseAgeExclude:
  - lucide-react@1.31.0
