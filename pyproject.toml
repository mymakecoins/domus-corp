[project]
name = "domus-corp-python"
version = "0.0.0"
description = "Domus Corp knowledge and intelligence Python workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["apps/knowledge-api/tests"]
pythonpath = ["apps/knowledge-api/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/knowledge-api/src", "apps/knowledge-api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/knowledge-api/src", "apps/knowledge-api/tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/knowledge-api/src/domus_knowledge"]
